name: CI/CD

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff build

      - name: Ruff lint
        run: ruff check .

      - name: Smoke check
        run: |
          python -m pip install -e .
          python -m compileall src/dSTORMQuant
          python -c "import dSTORMQuant; from dSTORMQuant.core.config.loader import load_config; from dSTORMQuant.core.config.models import SMMLConfig; print('smoke-ok')"
      - name: Build main package
        run: python -m build

      - name: Build finder_cpp wheel
        run: |
          python -m pip install numpy pybind11
          python -m pip wheel ./finder_cpp -w finder_cpp/dist --no-deps

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            finder_cpp/dist/*

  release:
    name: GitHub Release (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
