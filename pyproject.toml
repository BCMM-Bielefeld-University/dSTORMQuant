[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dSTORMQuant"]

[tool.hatch.build.targets.editable]
packages = ["src/dSTORMQuant"]

[project]
name = "dSTORMQuant"
version = "0.0.1"
description = "dSTORMQuant - Super-Resolution Microscopy (SMLM) Analysis Tool - Universität Bielefeld"
readme = "README.md"
requires-python = ">=3.10.12"
authors = [
    {name = "Suraj Karki", email = "suraj.karki500@gmail.com"}
]
license = {text = "MIT"}
keywords = ["microscopy", "smlm", "super-resolution", "research", "image-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "alphashape>=1.3.1",
    "anywidget>=0.9.21",
    "diptest>=0.11.0",
    "h5py>=3.14.0",
    "locan[all]>=0.20.0",
    "matplotlib>=3.10.3",
    "napari[all]>=0.6.2",
    "networkx>=3.4.2",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.3",
    "pyqt6>=5.15.11",
    "pyyaml>=6.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "seaborn>=0.13.0",
    "shapely>=2.1.1",
    "tqdm>=4.67.1",
    "et-xmlfile>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-qt>=4.4.0",  # For testing PyQt5 applications
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.31.0",
]
docs = [
    "sphinx>=8.1.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autodoc-typehints>=2.5.0",
    "myst-parser>=4.0.0",
    "nbsphinx>=0.9.5",  # For including notebooks in docs
]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-qt>=4.4.0",
]

all = [
    "dSTORMQuant[dev,docs]",
]

[project.scripts]
dSTORMQuant = "dSTORMQuant.main:main"
save-napari-visualizations = "dSTORMQuant.scripts.save_napari_visualizations:main"
merge-csv = "dSTORMQuant.scripts.merge_csv:main"
visualization-steps = "dSTORMQuant.scripts.visualize_steps:menu"

# UV-specific configuration
[tool.uv]
dev-dependencies = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-qt>=4.4.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.31.0",
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src/dSTORMQuant",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
qt_api = "pyqt5"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
